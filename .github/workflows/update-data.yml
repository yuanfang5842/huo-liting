name: Update 活力婷 Data (news & invest)
# 每 6 小时在 GitHub 服务器拉取真实要闻/财经，生成同域 JSON 提交回仓库
# PWA 直接读取同域 JSON（无跨域、无网络墙），手机端稳定显示真实数据
on:
  schedule:
    - cron: '0 */6 * * *'      # 每 6 小时整点
  workflow_dispatch: {}        # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate data JSON
        run: python tools/update_data.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/news.json assets/data/invest.json
          if git diff --cached --quiet; then
            echo "no changes, skip commit"
          else
            git commit -m "chore: auto-update news & invest data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
